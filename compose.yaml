services:
  vigia:
    build: &vigia-build
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${VIGIA_PORT:-8100}:8100"
    env_file:
      - path: ${VIGIA_CONFIG_FILE:-.env}
        required: false
    environment:
      VIGIA_DATA_DIR: /dataset
      VIGIA_OUT_DIR: /index
      VIGIA_WEB_OUT: /state
      VIGIA_THREAT_INTEL_PATH: /intel/snapshot.json
    volumes:
      - type: bind
        source: ${VIGIA_DATASET_PATH:-./data/dataset}
        target: /dataset
        read_only: true
        bind:
          create_host_path: false
      - vigia-index:/index
      - vigia-state:/state
      - vigia-intel:/intel:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8100/api/estado', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s

  inteligencia:
    profiles: [inteligencia]
    build: *vigia-build
    command: [python, -m, apps.backend.tools.threat_intel]
    environment:
      VIGIA_THREAT_INTEL_PATH: /intel/snapshot.json
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - vigia-intel:/intel
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  vigia-index:
  vigia-state:
  vigia-intel:
